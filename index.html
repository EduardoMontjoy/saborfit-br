<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#140D08" />
  <link rel="manifest" href="manifest.json" />
  <title>SaborFit BR — Recetas fit de 5 países</title>
  <link rel="stylesheet" href="features.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #E6B36E;
      --gold-soft: rgba(230,179,110,0.18);
      --gold-line: rgba(230,179,110,0.55);
      --ivory: #FBF5EC;
      --ink: #1C140E;
      --bg: #140D08;
      --text: #F7EFE4;
      --muted: rgba(247,239,228,0.6);
      --faint: rgba(247,239,228,0.4);
      --glass: rgba(74,54,38,0.42);
      --glass-strong: rgba(48,34,24,0.78);
      --glass-inner: rgba(255,240,220,0.07);
      --border: rgba(255,236,210,0.14);
      --hi: inset 0 1px 0 rgba(255,245,230,0.16);
      --shadow: 0 18px 40px rgba(8,4,2,0.45);
      --blur: blur(22px) saturate(140%);
      --overlay: linear-gradient(180deg, rgba(20,13,8,0.1) 0%, rgba(20,13,8,0.5) 28%, rgba(20,13,8,0.9) 58%, #140D08 100%);
      --c-kcal: #E6B36E; --c-prot: #A9C99A; --c-carb: #DE8F62; --c-fat: #C7A6D9; --water: #8CC3D6;
      --primary: var(--gold); --secondary: #DE8F62; --tertiary: var(--gold);
      --surface: var(--glass-strong); --surface-var: var(--glass-inner);
    }
    body.light {
      --gold: #A8732F;
      --gold-soft: rgba(168,115,47,0.14);
      --gold-line: rgba(168,115,47,0.5);
      --bg: #EFE6DA;
      --text: #2A1D13;
      --muted: rgba(42,29,19,0.64);
      --faint: rgba(42,29,19,0.44);
      --glass: rgba(255,250,243,0.55);
      --glass-strong: rgba(255,250,243,0.88);
      --glass-inner: rgba(120,84,50,0.08);
      --border: rgba(120,84,50,0.16);
      --hi: inset 0 1px 0 rgba(255,255,255,0.7);
      --shadow: 0 14px 34px rgba(90,60,30,0.16);
      --overlay: linear-gradient(180deg, rgba(239,230,218,0.45) 0%, rgba(239,230,218,0.82) 22%, rgba(239,230,218,0.97) 45%, #EFE6DA 100%);
      --c-prot: #5E8F4E; --c-carb: #C0683A; --c-fat: #8E64A8; --water: #3C8CA8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0B0705; color: var(--text); min-height: 100vh;
      display: flex; justify-content: center; align-items: center; padding: 14px;
      -webkit-font-smoothing: antialiased;
    }
    body.light { background: #D9CDBE; }
    button { font-family: inherit; color: inherit; }

    .phone-frame {
      width: 100%; max-width: 420px; height: 860px;
      background: var(--bg); border-radius: 44px; border: 7px solid #1E1611;
      box-shadow: 0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
      display: flex; flex-direction: column; overflow: hidden; position: relative; isolation: isolate;
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .phone-frame { max-width: 100%; height: 100dvh; border-radius: 0; border: none; box-shadow: none; }
    }
    /* Foto de fondo tipo "ventana al atardecer" */
    .bg-photo {
      position: absolute; inset: 0 0 35% 0; z-index: -2;
      background-size: cover; background-position: center;
      transform: scale(1.04); filter: saturate(1.05) brightness(0.92);
      transition: background-image 0.6s ease;
    }
    .bg-overlay { position: absolute; inset: 0; z-index: -1; background: var(--overlay); }

    /* Superficie de vidrio */
    .glass-card, .recipe-card, .pantry-row, .bottom-nav, .top-pill, .mode-switch, .search-box, .modal-sheet {
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      box-shadow: var(--hi), var(--shadow);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass-card, .recipe-card, .pantry-row, .bottom-nav, .top-pill, .mode-switch, .search-box, .modal-sheet { background: var(--glass-strong); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass-card, .recipe-card, .pantry-row, .bottom-nav, .top-pill, .mode-switch, .search-box, .modal-sheet { background: var(--glass-strong); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

    .top-bar { padding: 16px 16px 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 12; }
    .top-pill { display: flex; align-items: center; gap: 9px; border-radius: 999px; padding: 5px 14px 5px 5px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--ink); display: flex; align-items: center; justify-content: center; }
    .brand-mark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .brand { display: flex; flex-direction: column; line-height: 1.15; }
    .brand-title { font-size: 15px; font-weight: 500; letter-spacing: -0.2px; }
    .brand-sub { font-size: 9.5px; color: var(--muted); }
    .top-actions { display: flex; align-items: center; gap: 2px; border-radius: 999px; padding: 4px; }
    .icon-pill {
      position: relative; background: transparent; border: none; color: var(--text);
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s;
    }
    .icon-pill:hover { background: var(--glass-inner); }
    .icon-pill:active { transform: scale(0.9); }
    .icon-pill svg, .nav-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .badge-dot {
      position: absolute; top: -2px; right: -2px; background: var(--gold); color: var(--ink);
      font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 99px;
      display: flex; align-items: center; justify-content: center; padding: 0 4px;
    }
    .lang-pill { display: flex; gap: 1px; padding-left: 4px; border-left: 1px solid var(--border); margin-left: 2px; }
    .lang-btn { background: none; border: none; color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: 0.6px; padding: 6px; border-radius: 99px; cursor: pointer; }
    .lang-btn.active { background: var(--gold); color: var(--ink); }

    .content { flex: 1; overflow-y: auto; padding: 6px 16px 112px; scrollbar-width: none; }
    .content::-webkit-scrollbar, .modal-sheet::-webkit-scrollbar { display: none; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .anim-in { animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .pop { animation: fadeUp 0.3s ease; }
    @media (prefers-reduced-motion: reduce) { .anim-in, .pop, .modal-sheet { animation: none !important; } }

    /* Saludo grande tipo "Good evening, Sofia." */
    .eyebrow { font-size: 10px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 34px 0 10px; }
    .hero-title { font-size: 42px; line-height: 1.02; font-weight: 300; letter-spacing: -1.5px; text-shadow: 0 2px 24px rgba(0,0,0,0.25); }
    .hero-title em { font-style: normal; color: var(--gold); display: block; }
    .hero-sub { font-size: 12.5px; color: var(--muted); margin: 12px 0 24px; }
    .hero-sub b { color: var(--text); font-weight: 600; }
    .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.45; }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .card-title { font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .card-num { font-size: 24px; font-weight: 400; line-height: 1; text-align: right; }
    .card-num small { display: block; font-size: 9.5px; color: var(--muted); margin-top: 4px; }

    .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 999px; margin-bottom: 12px; }
    .mode-btn { border: none; background: none; color: var(--muted); padding: 10px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 0.25s; }
    .mode-btn.active-trad, .mode-btn.active-fit { background: var(--gold); color: var(--ink); font-weight: 600; box-shadow: 0 6px 18px rgba(230,179,110,0.28); }

    .type-switch { grid-template-columns: repeat(3, 1fr); }
    .type-switch .mode-btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
    .type-switch .mode-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .type-switch .mode-btn.on { background: var(--ivory); color: var(--ink); font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
    body.light .type-switch .mode-btn.on { background: #2A1D13; color: #FBF5EC; }
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box { flex: 1; color: var(--text); border-radius: 999px; padding: 12px 18px; font-size: 13px; outline: none; min-width: 0; }
    .search-box::placeholder { color: var(--faint); }
    .search-box:focus { border-color: var(--gold-line); }
    .dice-btn {
      background: var(--ivory); color: var(--ink); border: none; border-radius: 50%; width: 46px; height: 46px; flex-shrink: 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); transition: transform 0.2s;
    }
    body.light .dice-btn { background: #2A1D13; color: #FBF5EC; }
    .dice-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .dice-btn:active { transform: rotate(25deg) scale(0.92); }

    .quick-filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .qf-pill, .goal-chip, .chip {
      background: var(--glass-inner); border: 1px solid var(--border); color: var(--muted);
      border-radius: 999px; padding: 8px 13px; font-size: 11.5px; font-weight: 500; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }
    .qf-pill.active, .goal-chip.active, .chip.active { background: var(--gold); color: var(--ink); border-color: transparent; font-weight: 600; }
    .goal-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .goal-chip { padding: 10px 6px; }

    .glass-card { border-radius: 28px; padding: 18px; margin-bottom: 14px; }
    .rings-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .ring-box { position: relative; width: 66px; height: 66px; margin: 0 auto 8px; }
    .ring-box svg { transform: rotate(-90deg); width: 66px; height: 66px; }
    .ring-bg { fill: none; stroke-width: 4; opacity: 0.18; }
    .ring-fg { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1); }
    .ring-val { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 400; }
    .ring-label { font-size: 10.5px; color: var(--muted); }

    .progress-line { height: 3px; background: var(--glass-inner); border-radius: 99px; overflow: hidden; margin: 4px 0 6px; }
    .progress-line > div { height: 100%; background: var(--gold); border-radius: 99px; transition: width 0.6s ease; }

    .water-cups { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .cup {
      width: 28px; height: 32px; border-radius: 7px 7px 11px 11px; border: 1px solid var(--border); background: var(--glass-inner);
      cursor: pointer; position: relative; overflow: hidden; transition: transform 0.15s;
    }
    .cup:active { transform: scale(0.88); }
    .cup::after {
      content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 0%;
      background: linear-gradient(to top, rgba(140,195,214,0.95), rgba(140,195,214,0.45));
      transition: height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cup.filled::after { height: 100%; }

    /* Filas tipo itinerario */
    .log-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
    .row-ico { width: 32px; height: 32px; border-radius: 11px; flex-shrink: 0; background: var(--gold-soft); color: var(--gold); display: flex; align-items: center; justify-content: center; }
    .row-ico svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .row-main { flex: 1; min-width: 0; }
    .row-main b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-main small { color: var(--muted); font-size: 10.5px; }
    .row-end { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .log-del { background: var(--glass-inner); color: var(--muted); border: 1px solid var(--border); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 11px; flex-shrink: 0; }

    /* CTA claro tipo "Arriving in 25 min" */
    .btn-cta {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--ivory); color: var(--ink); border: none; border-radius: 999px; padding: 15px 18px;
      font-weight: 500; font-size: 13.5px; cursor: pointer; margin-bottom: 16px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.28); transition: transform 0.15s;
    }
    body.light .btn-cta { background: #2A1D13; color: #FBF5EC; }
    .btn-cta:active { transform: scale(0.98); }
    .btn-cta svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .chips-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
    .scroll-arrow { background: var(--glass-inner); color: var(--text); border: 1px solid var(--border); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .scroll-arrow:hover { background: var(--gold); color: var(--ink); }
    .chips-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; flex: 1; scroll-behavior: smooth; cursor: grab; user-select: none; }
    .chips-scroll::-webkit-scrollbar { display: none; }

    .section-label { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 2px 12px; }
    .section-label span { font-size: 17px; font-weight: 500; letter-spacing: -0.2px; }
    .section-label small { font-size: 11px; color: var(--muted); }

    /* Tarjetas de plato tipo "Grilled Salmon · $38" */
    .recipe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .recipe-card { border-radius: 26px; padding: 8px; cursor: pointer; position: relative; transition: transform 0.25s ease, border-color 0.25s; }
    .recipe-card:hover { transform: translateY(-3px); border-color: var(--gold-line); }
    .recipe-card.is-fav { border: 1.5px solid var(--gold); }
    .recipe-card.wide { display: grid; grid-template-columns: 124px 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
    .recipe-card.wide .recipe-img-wrap { height: 112px; }
    .recipe-img-wrap { position: relative; aspect-ratio: 1 / 0.92; width: 100%; overflow: hidden; border-radius: 19px; background: rgba(0,0,0,0.25); }
    .recipe-img-wrap.no-img { background: radial-gradient(circle at 50% 45%, rgba(230,179,110,0.22), rgba(0,0,0,0.25) 70%); }
    .recipe-img-wrap.no-img::after { content: 'Foto pronto'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .recipe-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
    .recipe-card:hover .recipe-img-wrap img { transform: scale(1.06); }
    .recipe-img-overlay { position: absolute; inset: 0; padding: 7px; display: flex; justify-content: space-between; align-items: flex-start; }
    .fav-check { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .fav-check svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .badge-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .pill-tag {
      background: rgba(20,13,8,0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      color: #F7EFE4; padding: 4px 9px; border-radius: 99px; font-size: 10px; font-weight: 500; border: 1px solid rgba(255,236,210,0.16);
    }
    .match-badge { background: var(--gold-soft); color: var(--gold); padding: 4px 9px; border-radius: 99px; font-weight: 600; font-size: 10px; white-space: nowrap; }
    .recipe-body { padding: 10px 6px 6px; }
    .recipe-title { font-size: 13.5px; font-weight: 500; margin-bottom: 6px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
    .recipe-kcal { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--gold); font-weight: 500; }
    .recipe-kcal small { font-size: 10px; color: var(--muted); font-weight: 400; }
    .recipe-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }
    .macro-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .m-pill { font-size: 10.5px; font-weight: 500; padding: 4px 9px; border-radius: 99px; background: var(--glass-inner); color: var(--muted); border: 1px solid var(--border); }
    .m-pill.p { color: var(--c-prot); }
    .m-pill.k { color: var(--gold); }

    .pantry-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; border-radius: 20px; margin-bottom: 8px; box-shadow: var(--hi); }
    .pantry-row.stocked { border-color: var(--gold-line); }
    .pantry-info h4 { font-size: 13.5px; font-weight: 500; margin-bottom: 2px; }
    .pantry-info span { font-size: 10.5px; color: var(--muted); }
    .switch { position: relative; width: 46px; height: 26px; background: var(--glass-inner); border: 1px solid var(--border); border-radius: 999px; cursor: pointer; transition: background 0.25s; flex-shrink: 0; }
    .switch.on { background: var(--gold); border-color: transparent; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #FBF5EC; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .switch.on::after { transform: translateX(20px); }

    /* Barra inferior flotante */
    .bottom-nav-wrap { position: absolute; bottom: 14px; left: 16px; right: 16px; z-index: 15; }
    .bottom-nav { border-radius: 999px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; background: var(--glass-strong); }
    .nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; font-size: 10px; font-weight: 500; cursor: pointer; border-radius: 999px; transition: all 0.25s; }
    .nav-btn.active { color: var(--ink); background: var(--gold); }
    .nav-btn svg { width: 19px; height: 19px; }

    .modal-backdrop { position: absolute; inset: 0; background: rgba(10,6,3,0.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; align-items: flex-end; z-index: 30; }
    .modal-backdrop.open { display: flex; }
    .modal-sheet { width: 100%; max-height: 92%; background: var(--glass-strong); border-radius: 32px 32px 0 0; overflow-y: auto; scrollbar-width: none; border-bottom: none; animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .sheet-grip { width: 38px; height: 4px; border-radius: 99px; background: var(--border); margin: 10px auto 0; }
    .modal-hero { position: relative; height: 210px; margin: 10px 10px 0; border-radius: 24px; overflow: hidden; }
    .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
    .modal-hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,13,8,0.7) 0%, rgba(20,13,8,0) 55%); }
    .modal-hero .badge-row { position: absolute; left: 12px; right: 12px; bottom: 12px; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(20,13,8,0.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,236,210,0.2); color: #F7EFE4; cursor: pointer; font-size: 13px; }
    .modal-expand { position: absolute; top: 12px; left: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(20,13,8,0.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,236,210,0.2); color: #F7EFE4; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .modal-expand svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        osc.start(); setTimeout(() => { osc.stop(); ctx.close(); }, 250);

    function bindHorizontalScroll() {
      document.querySelectorAll('.chips-scroll').forEach(el => {
        const key = el.dataset.key;
        if (key && chipsScrollPos[key]) el.scrollLeft = chipsScrollPos[key];
        el.addEventListener('scroll', () => { if (key) chipsScrollPos[key] = el.scrollLeft; });
        el.addEventListener('wheel', (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); el.scrollLeft += e.deltaY; }
        }, { passive: false });
        let isDown = false, startX = 0, scrollStart = 0, moved = false;
        el.addEventListener('mousedown', (e) => { isDown = true; moved = false; startX = e.pageX - el.offsetLeft; scrollStart = el.scrollLeft; });
        el.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const x = e.pageX - el.offsetLeft;
          if (Math.abs(x - startX) > 4) moved = true;
          el.scrollLeft = scrollStart - (x - startX);
        });
        window.addEventListener('mouseup', () => { isDown = false; });
        el.addEventListener('click', (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
      });
    }

    function ringHtml(label, cur, max, color, unit='g') {
      const r = 25, c = 2 * Math.PI * r;
      const offset = c * (1 - Math.min(cur / max, 1));
      return `
        <div>
          <div class="ring-box">
            <svg viewBox="0 0 64 64">
              <circle class="ring-bg" cx="32" cy="32" r="${r}" style="stroke:${color}" />
              <circle class="ring-fg" cx="32" cy="32" r="${r}" style="stroke:${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
            </svg>
            <div class="ring-val">${Math.round(cur)}${unit}</div>
          </div>
          <div class="ring-label">${label}</div>
        </div>
      `;
    }

    function addMissingToShop() {
      if (!activeRecipe) return;
      const stockIds = new Set(pantry.filter(p => p.inStock).map(p => p.id));
      let added = 0;
      activeRecipe.ingredients.forEach((i, idx) => {
        const ingId = SF.ingIdOf(activeRecipe, i, idx);
        const g = SF.gramsOf(i) * servingsPeople;
        if (!stockIds.has(ingId) && g > 0) {
          const existing = shoppingList.find(s => s.id === ingId);
          if (existing) { existing.grams += g; existing.done = false; }
          else shoppingList.push({ id: ingId, grams: g });
          added++;
        }
      });
      updateShopBadge();
      saveState();
      showToast(added ? `${tx().addedShop} (+${added})` : tx().allInStock);

            </div>
            ${list.map(item => `
              <div class="pantry-row ${item.inStock?'stocked':''}" onclick="toggleStock('${item.id}')" style="cursor:pointer">
                <div class="pantry-info">
                  <h4>${item.name[lang]}</h4>
                  <span>${item.kcal} kcal · P ${item.p}g / 100g</span>
                </div>
                <div class="switch ${item.inStock?'on':''}"></div>
              </div>
            `).join('')}
            ${SF.pantryEmptyHtml(list.length)}
            ${SF.pantryCookHtml()}
            <button class="btn-cta" onclick="SF.brainSheet('dish')">${ico('spark')} ${clean(tr.inventBtn)}</button>
          </div>
        `;
      } else if (currentTab === 'criar') {
        const countries = ['ALL','BRAZILIAN','MEXICAN','PERUVIAN','COLOMBIAN','SPANISH'];
        const q = searchQuery.trim().toLowerCase();
        const filtered = typePool.filter(r => {
          const matchC = selectedCountry === 'ALL' || r.country === selectedCountry;
          const matchQ = !q || r.title[lang].toLowerCase().includes(q);
          const matchQF =
            quickFilter === 'NONE' ||
            (quickFilter === 'FAST' && r.time <= 15) ||
            (quickFilter === 'HIGH_MATCH' && calcMatch(r) >= 60) ||
            (quickFilter === 'HIGH_PROT' && getMacros(r).p >= 30);
          return matchC && matchQ && matchQF && SF.passEq(r);
        });
        const readyAtHome = typePool.filter(r => calcMatch(r) >= 60).length;
        const noun = x.typeNoun[dishType];
        el.innerHTML = `
          <div class="anim-in">
            <div class="eyebrow">SaborFit · ${clean(tr.createSub).split('•')[0]}</div>
            <div class="hero-title">${x.greet[greetingIdx()]}<em>${dishType === 'dish' ? x.greetQ : x.greetQType[dishType]}</em></div>
            <div class="hero-sub">${x.heroSub(typePool.length, readyAtHome, noun)}</div>
            <div class="mode-switch type-switch">
              ${['dish','dessert','drink'].map(k => `<button class="mode-btn ${dishType===k?'on':''}" onclick="setDishType('${k}')">${ico(k === 'dish' ? 'bowl' : k === 'dessert' ? 'cake' : 'glass')}${x.types[k]}</button>`).join('')}
            </div>
            <div class="mode-switch">
              <button class="mode-btn ${!isFitMode?'active-trad':''}" onclick="setFitMode(false)">${x.tradMode}</button>
              <button class="mode-btn ${isFitMode?'active-fit':''}" onclick="setFitMode(true)">${x.fitMode}</button>
            </div>
            <div class="search-row">
              <input class="search-box" id="searchInput" type="text" placeholder="${x.searchPh}" value="${searchQuery}" oninput="searchQuery=this.value;render();refocusSearch()" />
              <button class="dice-btn" onclick="spinRoulette()" title="Sorpresa">${ico('dice')}</button>
            </div>
            <div class="quick-filters">
              <button class="qf-pill ${quickFilter==='FAST'?'active':''}" onclick="quickFilter=quickFilter==='FAST'?'NONE':'FAST';render()">${clean(x.qfFast)}</button>
              <button class="qf-pill ${quickFilter==='HIGH_MATCH'?'active':''}" onclick="quickFilter=quickFilter==='HIGH_MATCH'?'NONE':'HIGH_MATCH';render()">${clean(x.qfMatch)}</button>
              <button class="qf-pill ${quickFilter==='HIGH_PROT'?'active':''}" onclick="quickFilter=quickFilter==='HIGH_PROT'?'NONE':'HIGH_PROT';render()">${clean(x.qfProt)}</button>
              ${SF.eqFiltersHtml()}
            </div>
            <div class="chips-bar">
              <button class="scroll-arrow" onclick="scrollChips('countryScroll', -160)">‹</button>
              <div class="chips-scroll" id="countryScroll" data-key="country">
                ${countries.map(k => {
                  const cnt = k === 'ALL' ? typePool.length : typePool.filter(r => r.country === k).length;
                  return `<button class="chip ${selectedCountry===k?'active':''}" onclick="selectedCountry='${k}';render()">${k === 'ALL' ? clean(tr.countries[k]) : tr.countries[k]} · ${cnt}</button>`;
                }).join('')}
              </div>
              <button class="scroll-arrow" onclick="scrollChips('countryScroll', 160)">›</button>
            </div>
            ${dishType === 'dish' ? `<button class="btn-cta" onclick="runOfflineBrain()">${ico('spark')} ${clean(tr.inventBtn)}</button>` : ''}
            <div class="section-label"><span>${q || quickFilter !== 'NONE' || selectedCountry !== 'ALL' ? x.types[dishType] : x.forYou}</span><small>${filtered.length} ${noun}</small></div>
            <div class="recipe-grid">
              ${SF.pageCards(filtered, recipeCardHtml)}
            </div>
            ${SF.moreSentinel(filtered.length)}
          </div>
        `;
      } else if (currentTab === 'plan') {
        el.innerHTML = SF.renderPlan();
      } else {
        const favs = sorted.filter(r => r.fav);
        el.innerHTML = `
          <div class="anim-in">
            <div class="eyebrow">SaborFit · ${tr.recipes}</div>
            <div class="hero-title">${favs.length}<em>${clean(tr.favTitle)}</em></div>
            <div class="hero-sub">${clean(tr.favSub)}</div>
            ${favs.length ? `<div class="recipe-grid">${favs.map((r, i) => recipeCardHtml(r, i)).join('')}</div>` : `<div class="glass-card" style="font-size:13px;color:var(--muted);line-height:1.5;">${tr.favEmpty}</div>`}
            ${SF.myDishesHtml()}
          </div>
        `;
      }
      bindHorizontalScroll();
      SF.watchMore();
      saveStateSoon();
    }
    // Guardar en localStorage sin bloquear cada toque
    let saveTimer = 0;
    function saveStateSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }
    window.addEventListener('pagehide', () => saveState());
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });

    // Mantiene el foco y el cursor en el buscador al re-renderizar
    function refocusSearch() {
      const i = document.getElementById('searchInput');
      if (i) { i.focus(); const n = i.value.length; i.setSelectionRange(n, n); }
    }

    function loadSavedState() {
      try {
        const s = JSON.parse(localStorage.getItem('saborfit_br_state') || '{}');
        if (s.lang) lang = s.lang;
        if (s.goal) goal = s.goal;
        if (s.isLight) { isLight = true; document.body.classList.add('light'); }
        if (s.date === new Date().toISOString().slice(0,10)) {
          if (s.consumed) consumed = s.consumed;
          if (Array.isArray(s.todayLogs)) todayLogs = s.todayLogs;
          if (typeof s.waterCups === 'number') waterCups = s.waterCups;
        }
        if (Array.isArray(s.shoppingList)) shoppingList = s.shoppingList;
        if (Array.isArray(s.stockIds)) {
          const set = new Set(s.stockIds);
          pantry.forEach(p => p.inStock = set.has(p.id));
        }
        if (Array.isArray(s.favIds)) {
          const fset = new Set(s.favIds);
          recipes.forEach(r => r.fav = fset.has(r.id));
        }
      } catch {}
    }

    function saveState() {
      try {
        localStorage.setItem('saborfit_br_state', JSON.stringify({
          lang, goal, isLight,
          date: new Date().toISOString().slice(0,10),
          consumed, todayLogs, waterCups, shoppingList,
          stockIds: pantry.filter(p => p.inStock).map(p => p.id),
          favIds: recipes.filter(r => r.fav).map(r => r.id)
        }));
      } catch {}
    }

    loadSavedState();
    document.getElementById('themeBtn').innerHTML = isLight ? ico('moon') : ico('sun');
    setTab('criar');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
