<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2ECC71" />
  <link rel="manifest" href="manifest.json" />
  <title>SaborFit BR — 120 Platos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2ECC71;
      --primary-glow: rgba(46, 204, 113, 0.35);
      --secondary: #FF7043;
      --tertiary: #FFB300;
      --purple: #AB47BC;
      --bg: #0E1210;
      --surface: #171D1A;
      --surface-var: #222B26;
      --text: #F2F7F4;
      --muted: #94A39B;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at top, #18261e 0%, #070908 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .phone-frame {
      width: 100%;
      max-width: 420px;
      height: 820px;
      background: var(--bg);
      border-radius: 40px;
      border: 6px solid #262f2a;
      box-shadow: 0 30px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .phone-frame { max-width: 100%; height: 100dvh; border-radius: 0; border: none; }
    }
    .top-bar {
      padding: 14px 18px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 18, 16, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .brand { display: flex; flex-direction: column; }
    .brand-title { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
    .brand-sub { font-size: 10px; color: var(--primary); font-weight: 700; }
    .lang-pill {
      display: flex; background: var(--surface-var); border-radius: 12px; padding: 3px; gap: 2px;
    }
    .lang-btn {
      background: none; border: none; color: var(--muted);
      font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 9px; cursor: pointer;
    }
    .lang-btn.active { background: var(--primary); color: #052010; }

    .content {
      flex: 1; overflow-y: auto; padding: 14px 16px 96px; scrollbar-width: none;
    }
    .content::-webkit-scrollbar, .modal-sheet::-webkit-scrollbar { display: none; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-in { animation: fadeUp 0.3s cubic-bezier(0.22, 1, 0.36, 1) both; }

    h1 { font-size: 23px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 2px; }
    .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

    .mode-switch {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      background: var(--surface); padding: 4px; border-radius: 16px; border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .mode-btn {
      border: none; background: none; color: var(--muted);
      padding: 9px 8px; border-radius: 12px; font-size: 12px; font-weight: 800;
      cursor: pointer; transition: all 0.2s;
    }
    .mode-btn.active-trad { background: var(--secondary); color: #1b0803; }
    .mode-btn.active-fit { background: var(--primary); color: #052010; }

    .search-box {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); border-radius: 14px; padding: 10px 14px; font-size: 13px;
      margin-bottom: 10px; outline: none;
    }
    .search-box:focus { border-color: var(--primary); }

    .goal-bar { display: flex; gap: 6px; margin-bottom: 12px; }
    .goal-chip {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 12px; padding: 7px 6px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .goal-chip.active { background: rgba(46,204,113,0.14); color: var(--primary); border-color: var(--primary); }

    .glass-card {
      background: linear-gradient(145deg, #1b241f 0%, #141916 100%);
      border: 1px solid var(--border); border-radius: 22px; padding: 16px; margin-bottom: 14px;
    }
    .rings-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .ring-box { position: relative; width: 64px; height: 64px; margin: 0 auto 6px; }
    .ring-box svg { transform: rotate(-90deg); width: 64px; height: 64px; }
    .ring-bg { fill: none; stroke-width: 6.5; opacity: 0.16; }
    .ring-fg {
      fill: none; stroke-width: 6.5; stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .ring-val {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
    }
    .ring-label { font-size: 11px; color: var(--muted); font-weight: 600; }

    .btn-cta {
      width: 100%;
      background: linear-gradient(135deg, #2ECC71 0%, #1FA858 100%);
      color: #041d0e; border: none; border-radius: 16px; padding: 13px;
      font-weight: 800; font-size: 13px; cursor: pointer; margin-bottom: 14px;
      box-shadow: 0 8px 22px var(--primary-glow);
    }
    .btn-cta:active { transform: scale(0.97); }

    .chips-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
    .scroll-arrow {
      background: var(--surface-var); color: var(--text); border: 1px solid var(--border);
      width: 28px; height: 28px; border-radius: 10px; font-weight: 800; font-size: 14px;
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .scroll-arrow:hover { background: var(--primary); color: #052010; }
    .chips-scroll {
      display: flex; gap: 7px; overflow-x: auto; padding: 2px 0; scrollbar-width: none;
      flex: 1; scroll-behavior: smooth; cursor: grab; user-select: none;
    }
    .chips-scroll:active { cursor: grabbing; }
    .chips-scroll::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--surface-var); color: var(--text); border: 1px solid var(--border);
      border-radius: 13px; padding: 7px 12px; font-size: 11.5px; font-weight: 700;
      white-space: nowrap; cursor: pointer; transition: transform 0.15s, background 0.2s;
    }
    .chip.active { background: var(--primary); color: #052010; border-color: transparent; transform: scale(1.04); }

    .recipe-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden; margin-bottom: 12px; cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s;
    }
    .recipe-card:hover { transform: translateY(-2px); border-color: rgba(46,204,113,0.4); }
    .recipe-img-wrap { position: relative; height: 130px; width: 100%; overflow: hidden; background: #1e2722; }
    .recipe-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .recipe-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(14,18,16,0.92) 5%, rgba(14,18,16,0.12) 65%);
      display: flex; flex-direction: column; justify-content: space-between; padding: 9px 11px;
    }
    .badge-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .pill-tag {
      background: rgba(14,18,16,0.76); backdrop-filter: blur(8px);
      color: var(--text); padding: 4px 9px; border-radius: 9px;
      font-size: 10.5px; font-weight: 700; border: 1px solid rgba(255,255,255,0.12);
    }
    .match-badge {
      background: rgba(46, 204, 113, 0.92); color: #052010;
      padding: 4px 9px; border-radius: 9px; font-weight: 800; font-size: 10.5px;
    }
    .recipe-body { padding: 11px 13px 13px; }
    .recipe-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; line-height: 1.25; }
    .macro-pills { display: flex; gap: 5px; flex-wrap: wrap; }
    .m-pill {
      font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px;
      background: var(--surface-var); color: var(--muted);
    }
    .m-pill.p { color: var(--primary); background: rgba(46,204,113,0.12); }
    .m-pill.k { color: var(--secondary); background: rgba(255,112,67,0.12); }

    .pantry-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      padding: 11px 14px; border-radius: 16px; margin-bottom: 8px;
    }
    .pantry-row.stocked { border-color: rgba(46,204,113,0.32); }
    .pantry-info h4 { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; }
    .pantry-info span { font-size: 11px; color: var(--muted); }
    .switch {
      position: relative; width: 44px; height: 24px; background: var(--surface-var);
      border-radius: 999px; cursor: pointer; transition: background 0.2s; flex-shrink: 0;
    }
    .switch.on { background: var(--primary); }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: white; transition: transform 0.2s;
    }
    .switch.on::after { transform: translateX(20px); }

    .bottom-nav-wrap { position: absolute; bottom: 12px; left: 14px; right: 14px; z-index: 15; }
    .bottom-nav {
      background: rgba(23, 29, 26, 0.92); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.09); border-radius: 24px;
      display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 4px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .nav-btn {
      background: none; border: none; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .nav-btn.active { color: var(--primary); }
    .nav-btn span.ico { font-size: 18px; }

    .modal-backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; z-index: 30;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--surface); width: 100%; max-height: 90%;
      border-radius: 28px 28px 0 0; overflow-y: auto; scrollbar-width: none;
      animation: slideUp 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-hero { position: relative; height: 160px; width: 100%; }
    .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
    .modal-hero-grad { position: absolute; inset: 0; background: linear-gradient(to top, var(--surface) 5%, rgba(0,0,0,0.2) 80%); }
    .modal-content { padding: 0 18px 22px; margin-top: -22px; position: relative; }

    .people-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--surface-var); border-radius: 14px; padding: 8px 12px; margin: 10px 0;
    }
    .stepper { display: flex; align-items: center; gap: 10px; }
    .step-btn {
      width: 28px; height: 28px; border-radius: 9px; border: none;
      background: var(--primary); color: #052010; font-weight: 800; font-size: 16px; cursor: pointer;
    }
    .br-tip-box {
      background: rgba(255, 179, 0, 0.12); border: 1px solid rgba(255, 179, 0, 0.3);
      border-radius: 14px; padding: 10px 12px; font-size: 12px; margin: 8px 0; color: #ffe599;
    }
    .brain-box {
      background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3);
      border-radius: 14px; padding: 10px 12px; font-size: 12px; margin: 8px 0; color: #c7f7da;
    }
    .section-title { font-size: 12px; font-weight: 800; margin: 12px 0 6px; color: var(--primary); text-transform: uppercase; }
    .ing-item {
      font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .sub-br { font-size: 11px; color: var(--tertiary); font-weight: 600; }
    .step-box { background: var(--surface-var); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.4; }
    .timer-btn {
      margin-top: 6px; background: rgba(46,204,113,0.18); color: var(--primary);
      border: none; border-radius: 9px; padding: 5px 10px; font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .video-btn {
      width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px;
      background: #ff2e2e22; border: 1px solid #ff4d4d55; color: #ff8080;
      border-radius: 14px; padding: 11px; font-size: 12.5px; font-weight: 800;
      text-decoration: none; margin-top: 10px;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-sec {
      flex: 1; background: var(--surface-var); color: var(--text);
      border: none; border-radius: 14px; padding: 12px; font-weight: 700; cursor: pointer;
    }
    .toast {
      position: absolute; top: 64px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--primary); color: #052010; padding: 8px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 800; opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 40;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-title">🥗 SaborFit BR</div>
        <div class="brand-sub" id="appSub">140 Platos • Brasil</div>
      </div>
      <div class="lang-pill">
        <button class="lang-btn active" onclick="setLang('es')">ES</button>
        <button class="lang-btn" onclick="setLang('pt')">PT</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="content" id="appContent"></div>

    <div class="bottom-nav-wrap">
      <div class="bottom-nav">
        <button class="nav-btn active" onclick="setTab('hoje')"><span class="ico">🔥</span><span id="navHoje">Hoy</span></button>
        <button class="nav-btn" onclick="setTab('despensa')"><span class="ico">🧊</span><span id="navDespensa">Despensa</span></button>
        <button class="nav-btn" onclick="setTab('criar')"><span class="ico">🌍</span><span id="navCriar">Platos</span></button>
        <button class="nav-btn" onclick="setTab('receitas')"><span class="ico">⭐</span><span id="navReceitas">Favoritos</span></button>
      </div>
    </div>

    <div class="modal-backdrop" id="recipeModal" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet" id="modalBody"></div>
    </div>
  </div>

  <script src="brain.js"></script>
  <script src="dishes_catalog.js"></script>
  <script>
    let lang = 'es';
    let isFitMode = false; // Tradicional por defecto; Fit aparte!
    let goal = 'maintain';
    const goalTargets = {
      deficit: { kcal: 1850, p: 165, c: 150, f: 60 },
      maintain: { kcal: 2200, p: 160, c: 220, f: 70 },
      bulk: { kcal: 2700, p: 180, c: 310, f: 82 }
    };
    let consumed = { kcal: 640, p: 52, c: 58, f: 18 };
    let currentTab = 'criar';
    let selectedCategory = 'ALL';
    let selectedCountry = 'ALL';
    let searchQuery = '';
    let pantry = JSON.parse(JSON.stringify(PANTRY_DB));
    let recipes = JSON.parse(JSON.stringify(CATALOG_DISHES));
    let activeRecipe = null;
    let servingsPeople = 1;
    let timerInterval = null;
    let chipsScrollPos = { cat: 0, country: 0 };

    function scrollChips(id, delta) {
      const box = document.getElementById(id);
      if (!box) return;
      box.scrollBy({ left: delta, behavior: 'smooth' });
    }

    function bindHorizontalScroll() {
      document.querySelectorAll('.chips-scroll').forEach(el => {
        const key = el.dataset.key;
        if (key && chipsScrollPos[key]) el.scrollLeft = chipsScrollPos[key];

        el.addEventListener('scroll', () => {
          if (key) chipsScrollPos[key] = el.scrollLeft;
        });

        el.addEventListener('wheel', (e) => {
          if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
            e.preventDefault();
            el.scrollLeft += e.deltaY;
          }
        }, { passive: false });

        let isDown = false, startX = 0, scrollStart = 0, moved = false;
        el.addEventListener('mousedown', (e) => {
          isDown = true; moved = false;
          startX = e.pageX - el.offsetLeft;
          scrollStart = el.scrollLeft;
        });
        el.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const x = e.pageX - el.offsetLeft;
          if (Math.abs(x - startX) > 4) moved = true;
          el.scrollLeft = scrollStart - (x - startX);
        });
        window.addEventListener('mouseup', () => { isDown = false; });
        el.addEventListener('click', (e) => {
          if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }
        }, true);
      });
    }

    const EXTRA_UI = {
      es: {
        tradMode: "🍽️ Tradicional (BR)", fitMode: "💪 Modo Fit",
        searchPh: "Buscar plato (ej. Ramen, Ceviche, Tacos...)",
        people: "Personas:", brRec: "Recomendación en Brasil:",
        videoBtn: "🎥 Ver Video de Preparación (YouTube)",
        dishesCount: "platos disponibles"
      },
      pt: {
        tradMode: "🍽️ Tradicional (BR)", fitMode: "💪 Modo Fit",
        searchPh: "Buscar prato (ex. Ramen, Ceviche, Tacos...)",
        people: "Pessoas:", brRec: "Recomendação no Brasil:",
        videoBtn: "🎥 Ver Vídeo de Preparo (YouTube)",
        dishesCount: "pratos disponíveis"
      },
      en: {
        tradMode: "🍽️ Traditional (BR)", fitMode: "💪 Fit Mode",
        searchPh: "Search dish (e.g. Ramen, Ceviche, Tacos...)",
        people: "Servings:", brRec: "Brazil Ingredient Tip:",
        videoBtn: "🎥 Watch Preparation Video (YouTube)",
        dishesCount: "dishes available"
      }
    };

    function t() { return I18N[lang]; }
    function tx() { return EXTRA_UI[lang]; }

    function setLang(newLang) {
      lang = newLang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === lang));
      render();
      if (activeRecipe) renderModal();
    }

    function setFitMode(fit) {
      isFitMode = fit;
      render();
      if (activeRecipe) renderModal();
    }

    function setGoal(g) { goal = g; render(); }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2200);
    }

    function calcMatch(recipe) {
      const stockIds = new Set(pantry.filter(p => p.inStock).map(p => p.id));
      const hits = recipe.ingredients.filter(i => stockIds.has(isFitMode && i.fitId ? i.fitId : i.id)).length;
      return Math.round((hits * 100) / recipe.ingredients.length);
    }

    function getMacros(r) {
      return isFitMode ? (r.macrosFit || r.macros) : (r.macrosTrad || r.macros);
    }

    function ringHtml(label, cur, max, color, unit='g') {
      const r = 25, c = 2 * Math.PI * r;
      const offset = c * (1 - Math.min(cur / max, 1));
      return `
        <div>
          <div class="ring-box">
            <svg viewBox="0 0 64 64">
              <circle class="ring-bg" cx="32" cy="32" r="${r}" stroke="${color}" />
              <circle class="ring-fg" cx="32" cy="32" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}" />
            </svg>
            <div class="ring-val">${Math.round(cur)}${unit}</div>
          </div>
          <div class="ring-label">${label}</div>
        </div>
      `;
    }

    function recipeCardHtml(r, delayIdx = 0) {
      const countryLabel = t().countries[r.country] || r.country;
      const m = getMacros(r);
      const modeBadge = isFitMode ? '💪 Fit' : '🍽️ Original';
      return `
        <div class="recipe-card anim-in" style="animation-delay:${Math.min(delayIdx, 6) * 0.04}s" onclick="openRecipe('${r.id}')">
          <div class="recipe-img-wrap">
            <img src="${r.img}" alt="${r.title[lang]}" loading="lazy" onerror="this.style.display='none'" />
            <div class="recipe-img-overlay">
              <div class="badge-row">
                <span class="pill-tag">${countryLabel} • ${r.time}m</span>
                <span class="match-badge">${calcMatch(r)}% ${t().inHome}</span>
              </div>
              <div class="badge-row">
                <span class="pill-tag" style="color:${isFitMode?'#2ECC71':'#FFB300'};">${modeBadge}</span>
              </div>
            </div>
          </div>
          <div class="recipe-body">
            <div class="recipe-title">${r.title[lang]}</div>
            <div class="macro-pills">
              <span class="m-pill k">${m.kcal} kcal</span>
              <span class="m-pill p">P ${m.p}g</span>
              <span class="m-pill">C ${m.c}g</span>
              <span class="m-pill">G ${m.f}g</span>
            </div>
          </div>
        </div>
      `;
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach((b, idx) => {
        b.classList.toggle('active', ['hoje','despensa','criar','receitas'][idx] === tab);
      });
      render();
    }

    function toggleStock(id) {
      const item = pantry.find(p => p.id === id);
      if (item) item.inStock = !item.inStock;
      render();
    }

    function runOfflineBrain() {
      const tgt = goalTargets[goal];
      const remaining = {
        kcal: Math.max(250, tgt.kcal - consumed.kcal),
        p: Math.max(28, tgt.p - consumed.p),
        c: Math.max(15, tgt.c - consumed.c),
        f: Math.max(8, tgt.f - consumed.f)
      };
      const dish = generateOfflineBrainDish(pantry, selectedCountry, remaining, lang);
      dish.macrosTrad = dish.macros;
      dish.macrosFit = dish.macros;
      dish.brTip = { es: dish.brainReason, pt: dish.brainReason, en: dish.brainReason };
      dish.videoQuery = `como hacer ${dish.title.es}`;
      recipes.unshift(dish);
      openRecipe(dish.id);
    }

    function openRecipe(id) {
      activeRecipe = recipes.find(r => r.id === id);
      servingsPeople = 1;
      renderModal();
      document.getElementById('recipeModal').classList.add('open');
    }

    function closeModal() {
      clearInterval(timerInterval);
      document.getElementById('recipeModal').classList.remove('open');
    }

    function changePeople(delta) {
      servingsPeople = Math.min(10, Math.max(1, servingsPeople + delta));
      renderModal();
    }

    function startTimer(btn, sec) {
      clearInterval(timerInterval);
      let left = sec;
      btn.textContent = `⏱ ${left}s`;
      timerInterval = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(timerInterval); btn.textContent = '✅ OK!'; }
        else { btn.textContent = `⏱ ${left}s`; }
      }, 1000);
    }

    function logActiveMeal() {
      if (!activeRecipe) return;
      const m = getMacros(activeRecipe);
      consumed.kcal += m.kcal;
      consumed.p += m.p;
      consumed.c += m.c;
      consumed.f += m.f;
      closeModal();
      setTab('hoje');
      showToast(t().loggedToast);
    }

    function toggleFavActive() {
      if (!activeRecipe) return;
      activeRecipe.fav = !activeRecipe.fav;
      renderModal();
      render();
    }

    function renderModal() {
      if (!activeRecipe) return;
      const tr = t();
      const x = tx();
      const m = getMacros(activeRecipe);
      const ingNames = Object.fromEntries(pantry.map(p => [p.id, p.name[lang]]));
      const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(activeRecipe.videoQuery || activeRecipe.title[lang])}`;

      document.getElementById('modalBody').innerHTML = `
        <div class="modal-hero">
          <img src="${activeRecipe.img}" alt="" onerror="this.style.display='none'" />
          <div class="modal-hero-grad"></div>
        </div>
        <div class="modal-content">
          <div class="badge-row" style="margin-bottom:6px;">
            <span class="pill-tag">${tr.countries[activeRecipe.country] || activeRecipe.country} • ${activeRecipe.time}m</span>
            <span class="match-badge">${calcMatch(activeRecipe)}% ${tr.inHome}</span>
          </div>
          <h2 style="font-size:19px;font-weight:800;margin-bottom:8px;">${activeRecipe.title[lang]}</h2>

          <div class="mode-switch">
            <button class="mode-btn ${!isFitMode?'active-trad':''}" onclick="setFitMode(false)">${x.tradMode}</button>
            <button class="mode-btn ${isFitMode?'active-fit':''}" onclick="setFitMode(true)">${x.fitMode}</button>
          </div>

          <div class="people-bar">
            <span style="font-size:13px;font-weight:700;">👥 ${x.people} <b>${servingsPeople}</b></span>
            <div class="stepper">
              <button class="step-btn" onclick="changePeople(-1)">-</button>
              <button class="step-btn" onclick="changePeople(1)">+</button>
            </div>
          </div>

          <div style="font-size:12.5px;color:${isFitMode?'var(--primary)':'var(--secondary)'};font-weight:800;margin-bottom:6px;">
            Total (${servingsPeople}x): ${m.kcal * servingsPeople} kcal • ${m.p * servingsPeople}g ${tr.protein} • ${m.c * servingsPeople}g ${tr.carbs}
          </div>

          ${activeRecipe.brTip ? `<div class="br-tip-box">🇧🇷 <b>${x.brRec}</b> ${activeRecipe.brTip[lang]}</div>` : ''}

          <div class="section-title">${tr.ingredients}</div>
          ${activeRecipe.ingredients.map(i => {
            const ingId = (isFitMode && i.fitId) ? i.fitId : i.id;
            const g = isFitMode && i.fitGrams ? i.fitGrams : i.grams;
            return `
              <div class="ing-item">
                <span>• <b>${g * servingsPeople}g</b> ${ingNames[ingId] || ingId}</span>
                ${i.sub ? `<span class="sub-br">${tr.subst}: ${i.sub}</span>` : ''}
              </div>
            `;
          }).join('')}

          <div class="section-title">${tr.steps}</div>
          ${activeRecipe.steps[lang].map((s, idx) => `
            <div class="step-box">
              <div>${idx+1}. ${s.t}</div>
              ${s.s ? `<button class="timer-btn" onclick="startTimer(this, ${s.s})">▶ Timer ${Math.round(s.s/60)} min</button>` : ''}
            </div>
          `).join('')}

          <a class="video-btn" href="${ytUrl}" target="_blank" rel="noopener">${x.videoBtn}</a>

          <div class="modal-actions">
            <button class="btn-sec" onclick="toggleFavActive()">${activeRecipe.fav ? tr.saved : tr.save}</button>
            <button class="btn-cta" style="flex:2;margin:0;" onclick="logActiveMeal()">${tr.logMeal}</button>
          </div>
        </div>
      `;
    }

    function render() {
      const tr = t();
      const x = tx();
      document.getElementById('appSub').textContent = `${recipes.length} ${x.dishesCount} • Brasil`;
      document.getElementById('navHoje').textContent = tr.today;
      document.getElementById('navDespensa').textContent = tr.pantry;
      document.getElementById('navCriar').textContent = tr.create;
      document.getElementById('navReceitas').textContent = tr.recipes;

      const el = document.getElementById('appContent');
      const tgt = goalTargets[goal];
      const sorted = [...recipes].sort((a,b) => calcMatch(b) - calcMatch(a));

      if (currentTab === 'hoje') {
        el.innerHTML = `
          <div class="anim-in">
            <h1>${tr.today} (💪 Fit)</h1>
            <div class="subtitle">${tr.todaySub}</div>
            <div class="goal-bar">
              ${['deficit','maintain','bulk'].map(g => `<button class="goal-chip ${goal===g?'active':''}" onclick="setGoal('${g}')">${tr.goals[g]}</button>`).join('')}
            </div>
            <div class="glass-card">
              <div class="rings-row">
                ${ringHtml(tr.kcal, consumed.kcal, tgt.kcal, '#FF7043', '')}
                ${ringHtml(tr.protein, consumed.p, tgt.p, '#2ECC71')}
                ${ringHtml(tr.carbs, consumed.c, tgt.c, '#FFB300')}
                ${ringHtml(tr.fat, consumed.f, tgt.f, '#AB47BC')}
              </div>
            </div>
            <button class="btn-cta" onclick="setFitMode(true);setTab('criar')">${tr.ctaCook}</button>
            <div class="subtitle" style="margin-bottom:10px;font-weight:700;color:var(--text);">${tr.bestMatch}</div>
            ${recipeCardHtml(sorted[0], 1)}
          </div>
        `;
      } else if (currentTab === 'despensa') {
        const cats = ['ALL','PROTEIN','CARB_BR','DAIRY','VEGGIE','PANTRY'];
        const list = selectedCategory === 'ALL' ? pantry : pantry.filter(p => p.cat === selectedCategory);
        el.innerHTML = `
          <div class="anim-in">
            <h1>${tr.pantryTitle}</h1>
            <div class="subtitle">${tr.pantrySub}</div>
            <div class="chips-bar">
              <button class="scroll-arrow" onclick="scrollChips('catScroll', -140)">‹</button>
              <div class="chips-scroll" id="catScroll" data-key="cat">
                ${cats.map(k => `<button class="chip ${selectedCategory===k?'active':''}" onclick="selectedCategory='${k}';render()">${tr.cats[k]}</button>`).join('')}
              </div>
              <button class="scroll-arrow" onclick="scrollChips('catScroll', 140)">›</button>
            </div>
            ${list.map(item => `
              <div class="pantry-row ${item.inStock?'stocked':''}">
                <div class="pantry-info">
                  <h4>${item.name[lang]}</h4>
                  <span>${item.kcal} kcal • P ${item.p}g / 100g</span>
                </div>
                <div class="switch ${item.inStock?'on':''}" onclick="toggleStock('${item.id}')"></div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentTab === 'criar') {
        const countries = ['ALL','BRAZILIAN','MEXICAN','PERUVIAN','COLOMBIAN','SPANISH'];
        const q = searchQuery.trim().toLowerCase();
        const filtered = sorted.filter(r => {
          const matchC = selectedCountry === 'ALL' || r.country === selectedCountry;
          const matchQ = !q || r.title[lang].toLowerCase().includes(q);
          return matchC && matchQ;
        });
        el.innerHTML = `
          <div class="anim-in">
            <h1>${tr.createTitle}</h1>
            <div class="subtitle">${filtered.length} ${x.dishesCount} • ${tr.createSub}</div>
            <div class="mode-switch">
              <button class="mode-btn ${!isFitMode?'active-trad':''}" onclick="setFitMode(false)">${x.tradMode}</button>
              <button class="mode-btn ${isFitMode?'active-fit':''}" onclick="setFitMode(true)">${x.fitMode}</button>
            </div>
            <input class="search-box" type="text" placeholder="${x.searchPh}" value="${searchQuery}" oninput="searchQuery=this.value;render()" />
            <div class="chips-bar">
              <button class="scroll-arrow" onclick="scrollChips('countryScroll', -160)">‹</button>
              <div class="chips-scroll" id="countryScroll" data-key="country">
                ${countries.map(k => {
                  const cnt = k === 'ALL' ? recipes.length : recipes.filter(r => r.country === k).length;
                  return `<button class="chip ${selectedCountry===k?'active':''}" onclick="selectedCountry='${k}';render()">${tr.countries[k]} (${cnt})</button>`;
                }).join('')}
              </div>
              <button class="scroll-arrow" onclick="scrollChips('countryScroll', 160)">›</button>
            </div>
            <button class="btn-cta" onclick="runOfflineBrain()">${tr.inventBtn}</button>
            ${filtered.map((r, i) => recipeCardHtml(r, i)).join('')}
          </div>
        `;
      } else {
        const favs = sorted.filter(r => r.fav);
        el.innerHTML = `
          <div class="anim-in">
            <h1>${tr.favTitle}</h1>
            <div class="subtitle">${tr.favSub}</div>
            ${favs.length ? favs.map((r, i) => recipeCardHtml(r, i)).join('') : `<div class="glass-card">${tr.favEmpty}</div>`}
          </div>
        `;
      }
      bindHorizontalScroll();
      saveState();
    }

    function loadSavedState() {
      try {
        const s = JSON.parse(localStorage.getItem('saborfit_br_state') || '{}');
        if (s.lang) lang = s.lang;
        if (s.goal) goal = s.goal;
        if (s.consumed && s.date === new Date().toISOString().slice(0,10)) consumed = s.consumed;
        if (Array.isArray(s.stockIds)) {
          const set = new Set(s.stockIds);
          pantry.forEach(p => p.inStock = set.has(p.id));
        }
        if (Array.isArray(s.favIds)) {
          const fset = new Set(s.favIds);
          recipes.forEach(r => r.fav = fset.has(r.id));
        }
      } catch {}
    }
    function saveState() {
      try {
        localStorage.setItem('saborfit_br_state', JSON.stringify({
          lang,
          goal,
          date: new Date().toISOString().slice(0,10),
          consumed,
          stockIds: pantry.filter(p => p.inStock).map(p => p.id),
          favIds: recipes.filter(r => r.fav).map(r => r.id)
        }));
      } catch {}
    }

    loadSavedState();
    setTab('criar');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
